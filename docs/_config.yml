title: ScopeNod
description: Cadrage de projet assisté par IA — documentation utilisateur
lang: fr

# GitHub Pages (legacy Jekyll build, sans pipeline custom) sait résoudre un thème distant tant que
# le plugin jekyll-remote-theme est déclaré ci-dessous — c'est la méthode officiellement supportée
# pour utiliser un thème qui n'est pas dans la liste "Supported themes" du dropdown Pages.
# Doc : https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-a-theme-to-your-github-pages-site-using-jekyll#adding-a-theme
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

# ── Just the Docs ─────────────────────────────────────────────────────────────
color_scheme: light

search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
nav_sort: case_insensitive
nav_external_links:
  - title: Releases & téléchargements ↗
    url: https://github.com/Hrobitaillie/scopenod-releases/releases
    hide_icon: false

aux_links:
  "ScopeNod sur GitHub ↗":
    - "https://github.com/Hrobitaillie/scopenod-releases"

aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Haut de page"

footer_content: "ScopeNod — cadrez vite, cadrez juste. Documentation sous licence du projet."

last_edit_timestamp: false

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Astuce
    color: green
  important:
    title: Important
    color: purple
  warning:
    title: Attention
    color: yellow

# Un seul repo GitHub public : le lien "Voir cette page sur GitHub" pointe naturellement ici.
gh_edit_link: true
gh_edit_link_text: "Améliorer cette page sur GitHub"
gh_edit_repository: "https://github.com/Hrobitaillie/scopenod-releases"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

defaults:
  - scope:
      path: ""
    values:
      layout: default
